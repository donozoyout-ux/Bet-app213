name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: betapp
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: betapp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U betapp -d betapp_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      TEST_POSTGRES_URL: postgresql+asyncpg://betapp:test-only@localhost:5432/betapp_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall src legacy
      - run: python -c "import pathlib; paths=list(pathlib.Path('.').rglob('*.py')); assert not [str(p) for p in paths if b'\x00' in p.read_bytes()]"
      - run: python -m pytest -q
