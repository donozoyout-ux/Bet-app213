name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: betapp
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: betapp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U betapp -d betapp_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      TEST_POSTGRES_URL: postgresql+asyncpg://betapp:test-only@localhost:5432/betapp_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.8"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m compileall src legacy
      - run: python -c "import pathlib; paths=list(pathlib.Path('.').rglob('*.py')); assert not [str(p) for p in paths if b'\x00' in p.read_bytes()]"
      - name: Verify reviewed rollout and PostgreSQL admission first
        run: >-
          python -m pytest -q
          tests/test_europe_quality.py
          tests/test_api_responsiveness.py::test_postgres_10161_matches_concurrent_api_during_stats_backfill
          tests/test_live_updater.py::test_recent_statistics_rotates_all_eight_leagues_and_reports_progress
          tests/test_market_terminal.py::test_eight_league_rollout_scope_and_no_duplicate_queue
          tests/test_market_terminal.py::test_postgres_scope_migration_and_concurrent_immutable_capture
          tests/test_statistics_pipeline.py::test_rollout_does_not_mistake_odds_jobs_for_stats_and_retries_failed_only
          tests/test_statistics_pipeline.py::test_worker_uses_rollout_order_and_does_not_auto_run_disabled_jobs
      - run: python -m pytest -q -rP
      - name: Dashboard JavaScript syntax and degraded-state execution
        run: |
          node --check src/api/dashboard-revision.js
          node --check src/api/dashboard-analysis.js
          node tests/analysis_runtime.cjs
          node --check src/api/dashboard-learning.js
          node --check src/api/dashboard.js
          node --check src/api/dashboard-odds.js
          node --check src/api/dashboard-predictions.js
          node --check src/api/dashboard-market.js
          node --check src/api/dashboard-coupon.js
          node tests/dashboard_runtime.cjs
          node tests/predictions_runtime.cjs
          node tests/market_runtime.cjs
          node tests/coupon_runtime.cjs
          node --check src/api/dashboard-home.js
          node tests/home_runtime.cjs
