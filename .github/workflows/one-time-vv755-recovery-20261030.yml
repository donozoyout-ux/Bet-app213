# One-off recovery dispatch from the PR branch only. No schedule, no deploy, no source DML.
name: One-time vv755 encrypted recovery
on:
  push:
    branches:
      - codex/full-recovery-backup
permissions:
  contents: read
jobs:
  verify-production-recovery:
    if: ${{ github.ref == 'refs/heads/codex/full-recovery-backup' && github.event.head_commit.message == 'RUN_ONCE_VV755_RECOVERY_20261030_B8' }}
    uses: ./.github/workflows/full-recovery.yml
    with:
      backup_id: vv755-recovery-20261030-assistant-2
    secrets:
      ARCHIVE_DATABASE_URL: ${{ secrets.ARCHIVE_DATABASE_URL || secrets.RENDER_DATABASE_URL }}
      ARCHIVE_ENCRYPTION_KEY: ${{ secrets.RECOVERY_ENCRYPTION_KEY || secrets.ARCHIVE_ENCRYPTION_KEY }}
      ARCHIVE_GITHUB_TOKEN: ${{ secrets.ARCHIVE_GITHUB_TOKEN }}
