# One-time, source-DB-free format preflight. It prints no secret material.
name: Fresh recovery secret verification
on:
  push:
    branches:
      - codex/full-recovery-backup
permissions:
  contents: read
jobs:
  check:
    if: ${{ github.event.head_commit.message == 'CLASSIFY_RECOVERY_KEY_FORMAT_20261031_2' }}
    runs-on: ubuntu-latest
    env:
      RECOVERY_ENCRYPTION_KEY: ${{ secrets.RECOVERY_ENCRYPTION_KEY }}
    steps:
      - name: Check 32-byte Base64 key
        shell: bash
        run: |
          python - <<'PY'
          import base64, binascii, os
          key = os.environ.get("RECOVERY_ENCRYPTION_KEY", "").strip()
          if not key:
              print("RECOVERY_KEY_CHECK: missing")
              raise SystemExit(1)
          import re
          if re.fullmatch(r"[0-9a-fA-F]{64}", key):
              print("RECOVERY_KEY_CHECK: full_length_hex_key")
              raise SystemExit(0)
          try:
              raw = base64.b64decode(key, altchars=b"-_", validate=True)
          except (binascii.Error, ValueError):
              print("RECOVERY_KEY_CHECK: invalid_base64")
              raise SystemExit(1)
          if len(raw) != 32:
              print("RECOVERY_KEY_CHECK: not_32_bytes")
              raise SystemExit(1)
          print("RECOVERY_KEY_CHECK: valid_32_byte_base64")
          PY
