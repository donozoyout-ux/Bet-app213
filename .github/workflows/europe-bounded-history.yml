name: Supervised Europe history batch
on:
  workflow_dispatch:
    inputs:
      leagues:
        description: 'Reviewed Goaloo IDs (1-3 comma-separated); import-only'
        required: true
        default: '7,26'
      limit:
        description: 'Maximum matches per league (1-25)'
        required: true
        default: '25'
      albania_pilot:
        description: 'Source observation only: IDs 315/348, maximum five matches each'
        type: boolean
        default: false
      recent_first:
        description: 'Import newest finished fixtures first (at least three hours old)'
        type: boolean
        default: false
      activate_reviewed:
        description: 'Enable Poland/Denmark only after stored admission checks pass'
        type: boolean
        default: false
      fill_existing_odds:
        description: 'NULL-only archive repair: existing Poland/Denmark matches only'
        type: boolean
        default: false
      batches:
        description: 'Supervised repair batches (1-4), at most 50 matches per batch'
        default: '1'
permissions:
  contents: read
concurrency:
  group: europe-bounded-history
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: ${{ secrets.RENDER_DATABASE_URL }}
      NVIDIA_AI_ENABLED: 'false'
      NVIDIA_API_KEY: ''
      TELEGRAM_BOT_TOKEN: ''
      TELEGRAM_CHAT_ID: ''
      SCRAPER_WORKER_ENABLED: 'false'
      AUTO_BACKFILL_ON_EMPTY: 'false'
      BETAPP_PROCESS_ROLE: scraper
      SELECTED_LEAGUES: ${{ inputs.leagues }}
      MATCH_LIMIT: ${{ inputs.limit }}
      ALBANIA_PILOT: ${{ inputs.albania_pilot }}
      RECENT_FIRST: ${{ inputs.recent_first }}
      ACTIVATE_REVIEWED: ${{ inputs.activate_reviewed }}
      FILL_EXISTING_ODDS: ${{ inputs.fill_existing_odds }}
      BATCHES: ${{ inputs.batches }}
      EUROPE_API_GUARD_URL: https://bet-app213.onrender.com/health
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Import bounded batch into existing PostgreSQL
        run: |
          python - <<'PY'
          import asyncio, os
          from scripts.render_external_database import external_database_url
          os.environ['DATABASE_URL'] = external_database_url(os.environ['DATABASE_URL'])
          from scripts.europe_bounded_history import run
          from src.db import database
          async def main():
              try:
                  ids = [int(x.strip()) for x in os.environ['SELECTED_LEAGUES'].split(',')]
                  batches = int(os.environ.get('BATCHES') or '1')
                  if not 1 <= batches <= 4:
                      raise ValueError('Select 1-4 supervised batches')
                  if os.environ.get('FILL_EXISTING_ODDS') == 'true':
                      if any(os.environ.get(k) == 'true' for k in ('ALBANIA_PILOT','ACTIVATE_REVIEWED')):
                          raise ValueError('Archive repair cannot activate leagues or import pilots')
                      from scripts.verified_odds_backfill import run as repair
                      for _ in range(batches):
                          result = await repair(ids, int(os.environ['MATCH_LIMIT']))
                          if not sum(r['attempted'] for r in result) or any(r.get('stopped') for r in result):
                              break
                  else:
                      if batches != 1:
                          raise ValueError('Multiple batches require NULL-only archive repair')
                      await run(ids, int(os.environ['MATCH_LIMIT']), albania_pilot=os.environ.get('ALBANIA_PILOT') == 'true',
                                recent_first=os.environ.get('RECENT_FIRST') == 'true', activate=os.environ.get('ACTIVATE_REVIEWED') == 'true')
              finally:
                  await database.close()
          asyncio.run(main())
          PY
