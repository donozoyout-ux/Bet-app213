name: Verified history archive
on:
  schedule:
    - cron: '15 3 * * *'
  workflow_dispatch:
    inputs:
      plan_only:
        description: 'Read-only eligibility report; no Release upload'
        type: boolean
        default: true
      run_id:
        description: 'Immutable run ID; reuse to resume unchanged source data'
        required: false
permissions:
  contents: read
concurrency:
  group: board-backup-private-repository
  cancel-in-progress: false
jobs:
  export:
    if: vars.HISTORY_EXPORT_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && inputs.plan_only)
    environment: history-archive
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: verifier
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: history_verify
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U verifier -d history_verify'
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      HISTORY_EXPORT_ENABLED: 'true'
      HISTORY_SOURCE_DATABASE_URL: ${{ secrets.HISTORY_SOURCE_DATABASE_URL }}
      HISTORY_SOURCE_NAMESPACE: ${{ vars.HISTORY_SOURCE_NAMESPACE }}
      HISTORY_EXPORT_TOKEN: ${{ secrets.HISTORY_EXPORT_TOKEN }}
      HISTORY_ARCHIVE_KEY: ${{ secrets.HISTORY_ARCHIVE_KEY }}
      HISTORY_ARCHIVE_BUDGET_BYTES: ${{ vars.HISTORY_ARCHIVE_BUDGET_BYTES }}
      HISTORY_VERIFY_DATABASE_URL: postgresql+asyncpg://verifier:isolated-ci-only@127.0.0.1:5432/history_verify
      DATABASE_URL: ''
      NVIDIA_API_KEY: ''
      NVIDIA_AI_ENABLED: 'false'
      TELEGRAM_BOT_TOKEN: ''
      TELEGRAM_CHAT_ID: ''
      PLAN_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.plan_only }}
      REQUESTED_RUN_ID: ${{ inputs.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Export, restore and publish verified index
        shell: bash
        run: |
          if [ "$PLAN_ONLY" = "true" ]; then
            python -m src.archive.history_export --plan-only
            exit 0
          fi
          run_id="${REQUESTED_RUN_ID:-daily-$(date -u +%F)}"
          python -m src.archive.history_export --run-id "$run_id"
      # No plaintext artifact upload, production restore or eviction step.
